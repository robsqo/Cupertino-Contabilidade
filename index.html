<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupertino Contabilidade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            text-decoration: none;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
        .btn-instagram {
            background-color: #E1306C;
        }
        .btn-instagram:hover {
            background-color: #C13584;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cupertino Contabilidade</h1>
        <p>Fale conosco ou siga nossas redes:</p>
        
        <!-- LEIA OS COMENTÁRIOS ABAIXO PARA AJUSTAR SEUS LINKS -->
        <!-- Substitua o número abaixo pelo seu WhatsApp (com DDD e sem espaços) -->
        <a href="https://wa.me/5500999999999" target="_blank" class="btn btn-whatsapp">Fale no WhatsApp</a>
        
        <!-- Substitua o nome 'seuusuario' pelo seu perfil do Instagram -->
        <a href="https://instagram.com/seuusuario" target="_blank" class="btn btn-instagram">Siga no Instagram</a>
    </div>

</body>
</html>
