<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupertino Contabilidade</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0c10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            text-align: center;
            background: #1f2833;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 360px;
            width: 90%;
            box-sizing: border-box;
        }
        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 6px;
        }
        p {
            color: #c5a880;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .btn {
            display: block;
            text-decoration: none;
            color: white;
            padding: 14px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-whatsapp {
            background-color: #25D366;
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
            transform: translateY(-2px);
        }
        .btn-instagram {
            background-color: #E1306C;
        }
        .btn-instagram:hover {
            background-color: #C13584;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puxando a imagem com o código correto para o espaço no nome -->
        <img src="Logo%20Cupertino.jpeg" class="logo-img" alt="Logo Cupertino Contabilidade">
        
        <p>Fale conosco ou siga nossas redes:</p>
        
        <!-- Link do WhatsApp corrigido para 554499340723-->
        <a href="https://wa.me/554499340723" target="_blank" class="btn btn-whatsapp">Fale no WhatsApp</a>
        <a href="https://instagram.com/Cupertinocontabilidade" target="_blank" class="btn btn-instagram">Siga no Instagram</a>
    </div>

</body>
</html>
